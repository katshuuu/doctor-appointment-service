{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% block title %}Сервис записи к врачу{% endblock %}
    </title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body>
    <header class="site-header">
        <img
            src="{% static 'homepage/img/logo.png' %}"
            alt="Сервис записи к врачу"
            class="service-logo"
        >
        {% include "includes/navigation.html" %}
    </header>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="container site-footer mt-4 mb-3">
        <p>
            © <span id="current-year"></span>
            Сервис записи к врачу
        </p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
