<article class="card doctor-card mb-3">
    <div class="card-body d-flex justify-content-between align-items-center">
        <a href="{% url 'patients:detail' patient_index %}">
            {{ patient.name|default:"Без имени" }}
        </a>
        {% if patient.is_minor %}
            <span class="badge bg-warning text-dark">
                несовершеннолетний
            </span>
        {% else %}
            <span class="badge bg-light text-dark">
                совершеннолетний
            </span>
        {% endif %}
    </div>
</article>
